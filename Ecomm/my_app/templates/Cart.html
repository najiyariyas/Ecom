<h2>Your Cart</h2>

{% if cart_items %}
  <ul>
    {% for item in cart_items %}
      <li>
        <strong>{{ item.product.name }}</strong><br>
        Quantity: {{ item.quantity }}<br>
        Price: ₹{{ item.product.price }}<br>
        Subtotal: ₹{{ item.subtotal }}
      </li>
    {% endfor %}
  </ul>
  <h3>Total: ₹{{ total }}</h3>
{% else %}
  <p>Your cart is empty.</p>
{% endif %}
